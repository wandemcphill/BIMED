name: BIMED Actions Smoke

on:
  push:
    branches: [diag/bimed-actions-smoke-20260919]
  pull_request:
    branches: [main]

permissions:
  issues: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Smoke
        run: |
          echo "BIMED_ACTIONS_SMOKE_OK"
          node --version
          npm --version
      - name: Comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' 'BIMED_ACTIONS_SMOKE_OK' > /tmp/body.txt
          curl --fail-with-body --silent --show-error             -X POST             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"             --data-binary @<(jq -Rs '{body:.}')
