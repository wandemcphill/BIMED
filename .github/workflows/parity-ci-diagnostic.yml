name: Parity CI Diagnostic

on:
  pull_request:
    branches: [main]
  push:
    branches: [diag/parity-ci-20260919]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run CI stages and capture output
        shell: bash
        run: |
          set +e
          mkdir -p .ci-diagnostic
          node --version > .ci-diagnostic/environment.txt 2>&1
          npm --version >> .ci-diagnostic/environment.txt 2>&1

          run_stage() {
            name="$1"
            shift
            echo "### $name" >> .ci-diagnostic/summary.md
            echo "command: $*" >> .ci-diagnostic/summary.md
            "$@" > ".ci-diagnostic/$name.log" 2>&1
            code=$?
            echo "exit_code=$code" > ".ci-diagnostic/$name.exit"
            cat ".ci-diagnostic/$name.log" >> .ci-diagnostic/summary.md
            echo >> .ci-diagnostic/summary.md
          }

          run_stage install npm ci --legacy-peer-deps
          run_stage typecheck npm run typecheck
          run_stage test npm test
          run_stage build npm run build

          {
            echo "# Parity CI diagnostic"
            cat .ci-diagnostic/environment.txt
            echo
            cat .ci-diagnostic/summary.md
          } > .ci-diagnostic/report.md

      - name: Commit diagnostic output
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-diagnostic
          git commit -m "chore(ci): record parity diagnostic output" || exit 0
          git push origin HEAD:diag/parity-ci-20260919

      - name: Fail if a stage failed
        if: always()
        shell: bash
        run: |
          for f in .ci-diagnostic/*.exit; do
            grep -q 'exit_code=0' "$f" || exit 1
          done
