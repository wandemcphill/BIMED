name: Parity CI Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture CI diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p .ci-diagnostic
          node --version > .ci-diagnostic/environment.txt 2>&1
          npm --version >> .ci-diagnostic/environment.txt 2>&1

          run_stage() {
            name="$1"
            shift
            "$@" > ".ci-diagnostic/$name.log" 2>&1
            code=$?
            echo "[$name] exit_code=$code" >> .ci-diagnostic/results.txt
          }

          run_stage install npm ci --legacy-peer-deps
          run_stage typecheck npm run typecheck
          run_stage test npm test
          run_stage build npm run build

          {
            echo "Node/npm:"
            cat .ci-diagnostic/environment.txt
            echo
            cat .ci-diagnostic/results.txt
            for f in typecheck test build; do
              echo
              echo "===== $f ====="
              tail -n 120 ".ci-diagnostic/$f.log" 2>/dev/null || true
            done
          } > .ci-diagnostic/report.md

      - name: Post diagnostic report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file .ci-diagnostic/report.md || true

      - name: Preserve exact report in job summary
        if: always()
        run: cat .ci-diagnostic/report.md >> "${GITHUB_STEP_SUMMARY}"
