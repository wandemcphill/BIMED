name: Parity CI Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture CI diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p .ci-diagnostic
          node --version > .ci-diagnostic/environment.txt 2>&1
          npm --version >> .ci-diagnostic/environment.txt 2>&1

          run_stage() {
            name="$1"
            shift
            echo "===== $name =====" >> .ci-diagnostic/report.md
            echo "command: $*" >> .ci-diagnostic/report.md
            "$@" > ".ci-diagnostic/$name.log" 2>&1
            code=$?
            echo "exit_code=$code" >> .ci-diagnostic/report.md
            tail -n 160 ".ci-diagnostic/$name.log" >> .ci-diagnostic/report.md 2>&1 || true
            echo >> .ci-diagnostic/report.md
          }

          echo "# Parity CI diagnostic" > .ci-diagnostic/report.md
          cat .ci-diagnostic/environment.txt >> .ci-diagnostic/report.md
          echo >> .ci-diagnostic/report.md

          run_stage install npm ci --legacy-peer-deps
          run_stage typecheck npm run typecheck
          run_stage test npm test
          run_stage build npm run build

      - name: Post diagnostic report with REST API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          jq -n --rawfile body .ci-diagnostic/report.md '{body:$body}' > .ci-diagnostic/comment.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data-binary @.ci-diagnostic/comment.json || true

      - name: Fail if a CI stage failed
        if: always()
        shell: bash
        run: |
          if grep -q "exit_code=[1-9]" .ci-diagnostic/report.md; then
            exit 1
          fi
