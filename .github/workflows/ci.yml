name: CI

# Validation only. Deployment is handled by Render's own commit trigger.
# The test suite stubs the Resend transport and does not receive a live API key.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci --legacy-peer-deps 2>&1 | tee /tmp/npm-install.log

      - name: Typecheck
        if: always()
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Test
        if: always()
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log

      - name: Build
        if: always()
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Capture failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CI FAILURE RUN: ${{ github.run_id }}"
            echo "COMMIT: ${{ github.sha }}"
            echo
            echo "===== npm install ====="
            cat /tmp/npm-install.log 2>/dev/null || true
            echo
            echo "===== typecheck ====="
            cat /tmp/typecheck.log 2>/dev/null || true
            echo
            echo "===== test ====="
            cat /tmp/test.log 2>/dev/null || true
            echo
            echo "===== build ====="
            cat /tmp/build.log 2>/dev/null || true
          } > ci-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-failure.log
          git commit -m "ci: capture failure diagnostics [skip ci]" || true
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: /tmp/*.log
          if-no-files-found: warn
          retention-days: 3
