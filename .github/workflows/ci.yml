name: CI

# Validation only. Deployment is handled by Render's own commit trigger.
# The test suite stubs the Resend transport and does not receive a live API key.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps 2>&1 | tee /tmp/npm-install.log

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Test
        if: always()
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log

      - name: Build
        if: always()
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: /tmp/*-log
          if-no-files-found: warn
          retention-days: 3
