name: CI

# Validation only. Deployment is handled by Render's own commit trigger.
# The test suite stubs the Resend transport and does not receive a live API key.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Runtime diagnostics
        if: always()
        run: |
          mkdir -p ci-logs
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "npm_engine_strict=$(npm config get engine-strict)"
            echo "package_engines=$(node -p "require('./package.json').engines.node")"
            echo "lock_engines=$(node -p "require('./package-lock.json').packages[''].engines?.node || 'unset'")"
            echo "runner=$RUNNER_OS"
          } | tee ci-logs/runtime.txt

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci --legacy-peer-deps 2>&1 | tee ci-logs/npm-ci.txt

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-logs/typecheck.txt

      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee ci-logs/test.txt

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-logs/build.txt

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bimed-ci-${{ github.run_id }}
          path: ci-logs
          if-no-files-found: warn
