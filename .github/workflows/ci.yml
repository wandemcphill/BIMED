name: CI

# Validation only. Deployment is handled by Render's own commit trigger
# (see render.yaml autoDeployTrigger), so this workflow deliberately does not deploy.
# It also never sends email: the test suite stubs the Resend transport and no
# RESEND_API_KEY is provided to this job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
