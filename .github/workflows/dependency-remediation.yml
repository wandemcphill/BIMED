name: Temporary dependency remediation

on:
  push:
    branches:
      - fix/security-dependencies-20260921

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Regenerate lockfile and apply compatible audit fixes
        run: |
          set -euo pipefail
          npm install next@16.3.3 --save-exact --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true

      - name: Verify install and audit
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const meta = report.metadata || {};
          const vulns = meta.vulnerabilities || {};
          console.log(JSON.stringify({
            next: JSON.parse(fs.readFileSync('package.json','utf8')).dependencies.next,
            vulnerabilities: vulns
          }, null, 2));
          NODE

      - name: Commit lockfile remediation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix(security): patch vulnerable dependencies"
          git push
