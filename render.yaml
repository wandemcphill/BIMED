services:
  - type: web
    name: bimed-recruitment-portal
    runtime: node
    plan: starter
    autoDeployTrigger: commit
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_DIRECT_URL
        sync: false
      - key: SUPABASE_DB_SESSION_URL
        sync: false
      - key: SUPABASE_DB_TRANSACTION_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: noreply@bimedhealthcare.com
      - key: BIMED_LOCAL_RECRUITMENT_EMAIL
        value: recruitment@bimedhealthcare.com
      - key: BIMED_OVERSEAS_RECRUITMENT_EMAIL
        value: overseas@bimedhealthcare.com
      - key: BIMED_MANAGER_EMAIL
        value: manager@bimedhealthcare.com
      - key: BIMED_ADMIN_EMAIL
        value: info@bimedhealthcare.com
      - key: RECRUITMENT_ADMIN_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_NAME
        value: Bimed Administrator
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://recruitment.bimedhealthcare.com

  - type: cron
    name: bimed-recruitment-retention
    runtime: node
    schedule: "0 3 * * *"
    buildCommand: npm ci
    startCommand: node scripts/run-retention.mjs
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
